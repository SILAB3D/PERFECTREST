<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/moon.svg" />
    <!-- viewport-fit=cover: necesario para que env(safe-area-inset-*) funcione en el APK -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
    <meta name="theme-color" content="#090D1A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2F4FD" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Mejora tus horarios de sueño y despierta al final de un ciclo." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&display=swap"
      rel="stylesheet"
    />
    <title>PerfectRest</title>

    <!-- Pantalla de carga. Va en el HTML y no en React a propósito: se pinta en
         el primer fotograma, antes de que el bundle se descargue y monte, así
         que releva a la ventana de arranque nativa sin ningún parpadeo. Dura
         1,5 s en total, fundido de salida incluido. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #090d1a;
        /* Halo tenue: da profundidad sin necesitar ninguna imagen. */
        background-image: radial-gradient(60% 45% at 50% 42%, rgba(142, 123, 255, 0.16), transparent 70%);
        animation: splash-out 300ms ease 1200ms both;
      }
      #splash svg { width: 116px; height: 116px; overflow: visible; }
      /* 154,3 es la longitud del arco (r 34 barriendo 260°); 156 lo esconde
         entero, tapas redondeadas incluidas. */
      #splash .arc {
        stroke-dasharray: 156;
        stroke-dashoffset: 156;
        animation: splash-draw 700ms cubic-bezier(0.22, 0.61, 0.36, 1) 60ms both;
      }
      #splash .moon {
        transform-origin: 49px 51px;
        animation: splash-rise 520ms cubic-bezier(0.22, 0.61, 0.36, 1) 380ms both;
      }
      #splash p {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: #edf0ff;
        animation: splash-label 420ms cubic-bezier(0.22, 0.61, 0.36, 1) 760ms both;
      }
      @keyframes splash-draw { to { stroke-dashoffset: 0; } }
      @keyframes splash-rise {
        from { opacity: 0; transform: scale(0.55) rotate(-18deg); }
        to   { opacity: 1; transform: scale(1) rotate(0); }
      }
      @keyframes splash-label {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: none; }
      }
      @keyframes splash-out { to { opacity: 0; visibility: hidden; } }

      /* Con animaciones reducidas la marca aparece ya montada y sólo se funde. */
      @media (prefers-reduced-motion: reduce) {
        #splash .arc, #splash .moon, #splash p { animation: none; }
        #splash .arc { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Cargando PerfectRest">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="splash-grad" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#A594FF" />
            <stop offset=".55" stop-color="#8E7BFF" />
            <stop offset="1" stop-color="#4FE0BE" />
          </linearGradient>
        </defs>
        <path class="arc" d="M44.1 16.52A34 34 0 1 0 84 50" fill="none"
              stroke="url(#splash-grad)" stroke-width="7.5" stroke-linecap="round" />
        <path class="moon" fill="url(#splash-grad)"
              d="M36.68 32.77A22 22 0 1 0 67.23 63.32A28 28 0 0 1 36.68 32.77Z" />
      </svg>
      <p>PerfectRest</p>
    </div>
    <script>
      // El fundido acaba a los 1500 ms; se quita del DOM justo después para que
      // no deje una capa invisible interceptando toques.
      setTimeout(function () {
        var s = document.getElementById('splash');
        if (s) s.remove();
      }, 1500);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
