<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="PerfectRest">
  <defs>
    <linearGradient id="pr" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A594FF"/>
      <stop offset=".55" stop-color="#8E7BFF"/>
      <stop offset="1" stop-color="#4FE0BE"/>
    </linearGradient>
  </defs>
  <!-- Arco del ciclo de sueño: abierto hacia arriba a la derecha, por donde
       la luna despunta. -->
  <path d="M44.1 16.52A34 34 0 1 0 84 50" fill="none" stroke="url(#pr)" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Luna: el arco largo del disco (r 22) cerrado por el arco corto del disco
       que le da el mordisco (r 28). Un solo contorno, sin reglas de relleno:
       así la silueta sirve igual para el icono de notificación. -->
  <path fill="url(#pr)" d="M36.68 32.77A22 22 0 1 0 67.23 63.32A28 28 0 0 1 36.68 32.77Z"/>
</svg>
